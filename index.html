<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trình đơn Dropdown Ngang</title>
    <style type="text/css">
        html, body, h1, h2, h3, h4, ul, ol, li, p, a {
            padding: 0;
            border: 0;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        #menu {
            height: 40px;
            background-color: #333;
            padding-left: 20px;
        }

        #menu ul {
            list-style: none;
        }

        #menu > ul > li {
            float: left;
            position: relative;
        }

        #menu a {
            display: block;
            width: 120px;
            height: 40px;
            color: white;
            text-align: center;
            line-height: 40px;
            text-decoration: none;
            font-size: 15px;
        }

        #menu a:hover, #menu li:hover > a {
            background-color: #e74c3c;
        }

        #menu ul ul {
            position: absolute;
            top: 40px;
            left: 0;
            width: 120px;
            background-color: #333;
            visibility: hidden;
        }

        #menu ul ul li {
            float: none;
        }

        #menu li:hover > ul {
            visibility: visible;
        }
    </style>
</head>
<body>

    <div id="menu">
        <ul>
            <li><a href="#">Trang chủ</a></li>
            <li>
                <a href="#">Sản phẩm</a>
                <ul>
                    <li><a href="#">Laptop</a></li>
                    <li><a href="#">Điện thoại</a></li>
                    <li><a href="#">Máy tính bảng</a></li>
                </ul>
            </li>
            <li>
                <a href="#">Dịch vụ</a>
                <ul>
                    <li><a href="#">Thiết kế web</a></li>
                    <li><a href="#">Lập trình App</a></li>
                    <li><a href="#">SEO Marketing</a></li>
                </ul>
            </li>
            <li><a href="#">Liên hệ</a></li>
        </ul>
    </div>

</body>
</html>
